<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Birthday Countdown</title><style>

body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;

/* Smooth Love Gradient */

background:linear-gradient(135deg,#ff5f9e,#ff7eb3,#9a6bff);
}

/* TAP BOX */

.tapBox{
border:2px solid black;
padding:18px 28px;
font-size:18px;
cursor:pointer;
background:rgba(255,255,255,0.25);
border-radius:10px;
}

/* PAGE */

#page2{
display:none;
flex-direction:column;
align-items:center;
}

/* TEXT */

.topText{
font-size:18px;
margin-bottom:15px;
}

.bottomText{
font-size:17px;
margin-top:15px;
}

/* COUNTDOWN */

.countdown{
display:flex;
gap:10px;
}

.box{
background:rgba(255,255,255,0.3);
padding:10px;
border-radius:10px;
width:60px;
}

.number{
font-size:20px;
font-weight:bold;
}

.label{
font-size:10px;
}

/* HEARTS */

.heart{
position:absolute;
color:#ff2e63;
font-size:16px;
animation:float 7s linear infinite;
opacity:0.7;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

/* FINAL MESSAGE */

#birthdayMsg{
display:none;
font-size:26px;
margin-top:25px;
}

</style></head><body><div id="page1">
<div class="tapBox" onclick="openPage()">
🎁 Tap For Your Surprise
</div>
</div><div id="page2"><div class="topText">
❤️ I love you Laxmi wife 🫶🧿🥺
</div><div class="countdown"><div class="box">
<div id="days" class="number">00</div>
<div class="label">Days</div>
</div><div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div><div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div><div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div></div><div class="bottomText">
🥺 I miss you Baby 🥺🫶🧿
</div><div id="birthdayMsg">
🎉 Happy Birthday Laxmi bow 🫶🧿
</div></div><script>

/* SMOOTH HEART ANIMATION */

function heart(){

var h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

document.body.appendChild(h);

setTimeout(function(){h.remove()},7000);

}

setInterval(heart,800);

/* OPEN PAGE */

function openPage(){

document.getElementById("page1").style.display="none";

document.getElementById("page2").style.display="flex";

/* COUNTDOWN */

var targetDate=new Date("Mar 20, 2026 00:00:00").getTime();

var timer=setInterval(function(){

var now=new Date().getTime();

var distance=targetDate-now;

var days=Math.floor(distance/(1000*60*60*24));

var hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

var minutes=Math.floor((distance%(1000*60*60))/(1000*60));

var seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML=days;
document.getElementById("hours").innerHTML=hours;
document.getElementById("minutes").innerHTML=minutes;
document.getElementById("seconds").innerHTML=seconds;

if(distance<=0){

clearInterval(timer);

document.querySelector(".countdown").style.display="none";

document.querySelector(".topText").style.display="none";

document.querySelector(".bottomText").style.display="none";

document.getElementById("birthdayMsg").style.display="block";

}

},1000);

}

</script></body>
</html>
