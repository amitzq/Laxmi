<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Birthday Countdown</title><style>

body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;

background:linear-gradient(135deg,#ff5f9e,#ff7eb3,#9a6bff);
background-size:cover;
}

/* TAP BOX */

.tapBox{
border:2px solid black;
padding:16px 24px;
font-size:16px;
cursor:pointer;
background:rgba(255,255,255,0.25);
border-radius:8px;
}

/* PAGE */

#page2{
display:none;
flex-direction:column;
align-items:center;
}

/* TEXT */

.topText{
font-size:16px;
margin-bottom:10px;
}

.bottomText{
font-size:15px;
margin-top:10px;
}

/* COUNTDOWN */

.countdown{
display:flex;
gap:6px;
}

.box{
background:rgba(255,255,255,0.35);
padding:8px;
border-radius:8px;
width:55px;
}

.number{
font-size:16px;
font-weight:bold;
}

.label{
font-size:9px;
}

/* HEARTS */

.heart{
position:absolute;
color:#ff2e63;
font-size:14px;
animation:float 8s linear infinite;
opacity:0.7;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

/* FINAL MESSAGE */

#birthdayMsg{
display:none;
font-size:22px;
margin-top:20px;
}

</style></head><body><div id="page1">
<div class="tapBox" onclick="openPage()">
🎁 Tap For Your Surprise
</div>
</div><div id="page2"><div class="topText">
❤️ I love you Laxmi wife 🫶🧿🥺
</div><div class="countdown"><div class="box">
<div id="days" class="number">00</div>
<div class="label">Days</div>
</div><div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div><div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div><div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div></div><div class="bottomText">
🥺 I miss you Baby 🥺🫶🧿
</div><div id="birthdayMsg">
🎉 Happy Birthday Laxmi bow 🫶🧿
</div></div><script>

/* HEART ANIMATION */

function heart(){
var h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(function(){h.remove()},8000);
}

setInterval(heart,1200);

/* OPEN PAGE */

function openPage(){

document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="flex";

var targetDate=new Date("Mar 20, 2026 00:00:00").getTime();

var timer=setInterval(function(){

var now=new Date().getTime();
var distance=targetDate-now;

var days=Math.floor(distance/(1000*60*60*24));
var hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
var minutes=Math.floor((distance%(1000*60*60))/(1000*60));
var seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML=days;
document.getElementById("hours").innerHTML=hours;
document.getElementById("minutes").innerHTML=minutes;
document.getElementById("seconds").innerHTML=seconds;

if(distance<=0){

clearInterval(timer);

document.querySelector(".countdown").style.display="none";

document.querySelector(".topText").style.display="none";

document.querySelector(".bottomText").style.display="none";

document.getElementById("birthdayMsg").style.display="block";

}

},1000);

}

</script></body>
</html>
