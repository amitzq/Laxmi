<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Birthday</title><style>

body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
}

/* BACKGROUND IMAGE */

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-1;
display:none;
}

/* TAP BOX */

.tapBox{
border:2px solid white;
padding:18px 28px;
font-size:18px;
cursor:pointer;
background:rgba(0,0,0,0.5);
border-radius:10px;
}

/* PAGE */

#page2{
display:none;
flex-direction:column;
align-items:center;
}

/* TEXT */

.topText{
font-size:18px;
margin-bottom:12px;
}

.bottomText{
font-size:17px;
margin-top:12px;
}

/* COUNTDOWN */

.countdown{
display:flex;
gap:6px;
}

.box{
background:rgba(0,0,0,0.5);
padding:8px;
border-radius:8px;
width:55px;
}

.number{
font-size:16px;
font-weight:bold;
}

.label{
font-size:9px;
}

/* FINAL MESSAGE */

#birthdayMsg{
display:none;
font-size:24px;
margin-top:20px;
}

</style></head><body><img src="Image.jpg" class="bg" id="bg"><audio id="song" src="Song.mp3"></audio>

<div id="page1">
<div class="tapBox" onclick="openPage()">
🎁 Tap For Your Surprise
</div>
</div><div id="page2"><div class="topText">
❤️ I love you Laxmi wife 🫶🧿🥺
</div><div class="countdown"><div class="box">
<div id="days" class="number">00</div>
<div class="label">Days</div>
</div><div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div><div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div><div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div></div><div class="bottomText">
🥺 I miss you Baby 🥺🫶🧿
</div><div id="birthdayMsg">
🎉 Happy Birthday Laxmi bow 🫶🧿
</div></div><script>

function openPage(){

document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="flex";

/* SHOW BACKGROUND IMAGE */

document.getElementById("bg").style.display="block";

/* PLAY SONG */

document.getElementById("song").play();

/* COUNTDOWN */

var targetDate=new Date("Mar 20, 2026 00:00:00").getTime();

var timer=setInterval(function(){

var now=new Date().getTime();

var distance=targetDate-now;

var days=Math.floor(distance/(1000*60*60*24));

var hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

var minutes=Math.floor((distance%(1000*60*60))/(1000*60));

var seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML=days;
document.getElementById("hours").innerHTML=hours;
document.getElementById("minutes").innerHTML=minutes;
document.getElementById("seconds").innerHTML=seconds;

if(distance<=0){

clearInterval(timer);

document.querySelector(".countdown").style.display="none";

document.querySelector(".topText").style.display="none";

document.querySelector(".bottomText").style.display="none";

document.getElementById("birthdayMsg").style.display="block";

}

},1000);

}

</script></body>
</html>
