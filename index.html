<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Birthday Countdown</title><style>

body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;

/* Romantic Gradient */

background:linear-gradient(135deg,#ff4e8a,#ff7eb3,#8f5cff);
}

/* TAP BOX */

.tapBox{
border:3px solid black;
padding:25px 40px;
font-size:22px;
cursor:pointer;
background:rgba(255,255,255,0.25);
border-radius:12px;
}

/* PAGE */

#page2{
display:none;
flex-direction:column;
align-items:center;
}

/* TEXT */

.topText{
font-size:26px;
margin-bottom:20px;
}

.bottomText{
font-size:24px;
margin-top:20px;
}

/* COUNTDOWN */

.countdown{
display:flex;
gap:15px;
}

.box{
background:rgba(255,255,255,0.3);
padding:15px;
border-radius:12px;
width:80px;
}

.number{
font-size:26px;
font-weight:bold;
}

.label{
font-size:12px;
}

/* LOVE HEART ANIMATION */

.heart{
position:absolute;
color:#ff2e63;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(0.5);
opacity:1;
}
100%{
transform:translateY(-10vh) scale(1.2);
opacity:0;
}
}

/* FINAL MESSAGE */

#birthdayMsg{
display:none;
font-size:38px;
margin-top:30px;
}

</style></head><body><div id="page1">
<div class="tapBox" onclick="openPage()">
🎁 Tap For Your Surprise
</div>
</div><div id="page2"><div class="topText">
❤️ I love you Laxmi wife 🫶🧿🥺
</div><div class="countdown"><div class="box">
<div id="days" class="number">00</div>
<div class="label">Days</div>
</div><div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div><div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div><div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div></div><div class="bottomText">
🥺 I miss you Baby 🥺🫶🧿
</div><div id="birthdayMsg">
🎉 Happy Birthday Laxmi bow 🫶🧿
</div></div><script>

/* HEART ANIMATION */

function heart(){

var h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(Math.random()*25+15)+"px";

document.body.appendChild(h);

setTimeout(function(){h.remove()},6000);

}

setInterval(heart,300);

/* OPEN PAGE */

function openPage(){

document.getElementById("page1").style.display="none";

document.getElementById("page2").style.display="flex";

/* COUNTDOWN */

var targetDate=new Date("Mar 20, 2026 00:00:00").getTime();

var timer=setInterval(function(){

var now=new Date().getTime();

var distance=targetDate-now;

var days=Math.floor(distance/(1000*60*60*24));

var hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

var minutes=Math.floor((distance%(1000*60*60))/(1000*60));

var seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML=days;
document.getElementById("hours").innerHTML=hours;
document.getElementById("minutes").innerHTML=minutes;
document.getElementById("seconds").innerHTML=seconds;

if(distance<=0){

clearInterval(timer);

document.querySelector(".countdown").style.display="none";

document.querySelector(".topText").style.display="none";

document.querySelector(".bottomText").style.display="none";

document.getElementById("birthdayMsg").style.display="block";

}

},1000);

}

</script></body>
</html>
